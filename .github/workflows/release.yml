name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run desktop:build
      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe "release-artifacts/pbz-companion-$tag-windows-x64-setup.exe"
          Copy-Item target/release/bundle/msi/*.msi "release-artifacts/pbz-companion-$tag-windows-x64.msi"
          Compress-Archive -Path target/release/pbz-companion.exe -DestinationPath "release-artifacts/pbz-companion-$tag-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: pbz-companion-windows-x64
          path: release-artifacts/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
